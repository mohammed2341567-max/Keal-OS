name: Deploy KEAL OS Web Edition to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q server.py scripts tests
      - name: Check browser JavaScript syntax
        run: |
          for file in web/*.js; do node --check "$file"; done
      - name: Build Web Edition
        run: python scripts/build_web.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
